# ---------- 연구 분야 ----------
research:
  - title: 마음챙김과 자기자비 기반 개입
    desc: 마음챙김 명상과 자기자비가 불안, 우울, 심리적 안녕감에 미치는 효과를 검증하고, 한국판 척도를 타당화합니다.
  - title: 디지털 기반 청소년 정신건강 개입
    desc: 모바일 앱을 활용한 마음챙김·동작치료 프로그램을 개발하고 청소년의 불안 완화 효과를 연구합니다.
  - title: 심리평가
    desc: 로샤, 문장완성검사 등 투사적 검사와 객관적 검사를 임상 현장에서 어떻게 해석하고 활용할지 연구합니다.
  - title: 조현병 환자의 인지재활과 정신재활
    desc: 전산화 인지재활 훈련, 낙인 극복 프로그램, 집단치료가 만성 조현병 환자의 증상과 기능에 미치는 영향을 연구합니다.
  - title: 애착과 부부·가족 관계
    desc: 성인 애착, 감정표현불능증, 정서중심 부부치료의 효과를 다룹니다.



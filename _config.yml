# =====================================================================
#   이우경 LAB 홈페이지 — 내용 수정 파일
# =====================================================================
#
#  이 파일의 한글 텍스트만 고치면 홈페이지가 자동으로 다시 만들어집니다.
#  (GitHub에서 연필 아이콘 → 수정 → Commit changes → 1~2분 뒤 반영)
#
#  규칙 3가지
#   1. 콜론(:) 왼쪽의 영문 이름은 바꾸지 마세요. 오른쪽 값만 바꾸세요.
#   2. 들여쓰기(앞 공백)는 그대로 유지하세요. 탭 대신 공백을 씁니다.
#   3. 값에 콜론(:)이나 #이 들어가면 전체를 따옴표로 감싸세요.
#      예)  desc: "주제: 머신러닝"
#
#  목록(구성원, 연구 주제, 연락처, 소식)은 "- name:" 처럼 하이픈으로
#  시작하는 덩어리를 통째로 복사해 붙이면 항목이 추가되고,
#  덩어리를 지우면 항목이 삭제됩니다.
# =====================================================================


# ---------- 연구실 기본 정보 ----------
lab:
  name: 이우경 LAB                         # 홈페이지 제목 (탭 제목, 검색 결과 제목)
  name_en: Lee Woo-kyung Laboratory        # 영문 이름 (상단 작은 글씨)
  subtitle: 이우경 교수 연구실              # 큰 제목 둘째 줄
  tagline: 함께 질문하고, 끝까지 파고드는 작은 연구실입니다. 지도교수와 연구원생이 긴밀하게 협력하며 연구를 이어갑니다.
  affiliation: SCU대학교 대학원 상담임상심리학과  # 예) OO대학교 OO학과
  description: 이우경 교수 연구실(이우경 LAB) 공식 홈페이지. 구성원, 연구 분야, 연락처를 안내합니다.   # 검색 결과에 보이는 한 줄 설명
  keywords: 이우경 LAB, 이우경 연구실, 이우경 교수, 천윤형, 권혁민, 대학원 연구실


# ---------- 연구실 소개 (문단 단위, 원하는 만큼 추가) ----------
about:
  - 이우경 LAB은 이우경 교수의 지도 아래 운영되는 연구실입니다.
  - 소규모 연구실의 장점을 살려 구성원 각자가 연구 주제를 깊이 있게 탐구하고, 정기 세미나와 토론을 통해 서로의 연구를 발전시킵니다.
  - 연구에 관심 있는 학부생과 대학원 진학 희망자의 문의를 환영합니다.


# ---------- 구성원 ----------
#  pi: true 인 사람은 지도교수로 크게 표시됩니다.
#  email 은 비워두면 표시되지 않습니다.
members:
  - name: 이우경
    name_en: Lee Woo-kyung
    role: 지도교수
    role_en: Principal Investigator
    pi: true
    desc: 연구실을 이끄는 지도교수로서 연구 방향을 설계하고 연구원생의 연구를 지도합니다.
    email: ""

  - name: 천윤형
    name_en: Cheon Yun-hyeong
    role: 박사과정
    role_en: Ph.D. Student
    pi: false
    desc: 박사과정 연구원으로 연구를 수행하고 있습니다.
    email: ""

  - name: 권혁민
    name_en: Kwon Hyeok-min
    role: 석사과정
    role_en: M.S. Student
    pi: false
    desc: 석사과정 연구원으로 연구를 수행하고 있습니다.
    email: ""



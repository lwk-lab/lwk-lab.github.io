  affiliation: 서울사이버대학교 대학원 상담·임상심리학과
  tagline: 캠퍼스는 온라인에 있지만 연구는 실재합니다. 전국 각지에서 각자의 삶을 살아가며 함께 공부하는 작은 연구 공동체입니다.
  description: 이우경랩(이우경 LAB) — 서울사이버대학교 대학원 상담·임상심리학과 이우경 교수 연구실 공식 홈페이지. 마음챙김, 심리평가, 정신재활 연구. 구성원, 연구 분야, 세미나 일정 안내.
  keywords: 이우경랩, 이우경 랩, 이우경 LAB, 이우경 연구실, 이우경 교수 연구실, 서울사이버대학교 대학원, 상담임상심리학과, 마음챙김, 심리평가, 천윤형, 권혁민


# ---------- 연구실 소개 (문단 단위) ----------
about:
  - 이우경 LAB은 서울사이버대학교 대학원 상담·임상심리학과 이우경 교수의 지도 아래 운영되는 연구실입니다.
  - 사이버대학원의 특성상 따로 모이는 공간은 없습니다. 그래서 이 홈페이지가 우리의 연구실입니다. 각자의 연구가 어디까지 왔는지, 다음 세미나는 언제인지, 우리가 무엇을 지향하는지를 여기에 기록하고 공유합니다.
  - 마음챙김과 자기자비, 심리평가, 정신재활을 중심으로 사람의 마음을 과학적으로 이해하고 돕는 연구를 합니다. 연구에 관심 있는 대학원 진학 희망자의 문의를 환영합니다.


# ---------- 비전과 운영 원칙 ----------
vision: 임상 현장과 과학적 근거를 잇는 연구로, 마음이 아픈 사람들에게 실제로 닿는 도움을 만든다.
principles:
  - 정기 세미나는 거르지 않는다. 만나지 못하는 만큼 약속한 시간은 지킨다.
  - 질문은 늦어도 하루 안에 답한다. 혼자 막혀 있는 시간을 줄인다.
  - 작은 진전도 기록하고 공유한다. 진행 중인 연구가 서로에게 보이게 한다.
  - 실패한 분석, 기각된 가설도 발표한다. 그것도 연구다.
  - 연구 윤리와 참여자 보호를 모든 판단의 앞에 둔다.



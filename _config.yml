  - title: 연구 주제 3
    desc: 세부 설명을 입력하세요


# ---------- 소식 (최신 것을 맨 위에, 없으면 섹션이 숨겨짐) ----------
news:
  - date: 2026-11-08
    text: 이우경 LAB 홈페이지를 열었습니다.


